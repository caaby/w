#!/usr/bin/env bash

set -euo pipefail

HOST_DIR="build_dir/host"

AX23_ENTRY='{product_name:Archer AX23,product_ver:1.0,special_id:52550000}'
AX23V_ENTRY='{product_name:Archer AX23V,product_ver:1.0,special_id:4A500000}'

echo "======================================"
echo "Patch TP-Link AX23V safeloader"
echo "======================================"

echo
echo "Searching tplink-safeloader.c..."

mapfile -t SOURCES < <(
    find "$HOST_DIR" \
        -type f \
        -path '*/src/tplink-safeloader.c' \
        -print
)

if [ "${#SOURCES[@]}" -eq 0 ]; then
    echo "ERROR: tplink-safeloader.c not found"
    exit 1
fi

for SOURCE in "${SOURCES[@]}"; do

    echo
    echo "--------------------------------------"
    echo "Source:"
    echo "$SOURCE"
    echo "--------------------------------------"

    # ------------------------------------------------------------
    # Already patched
    # ------------------------------------------------------------
    if grep -qF "$AX23V_ENTRY" "$SOURCE"; then
        echo "AX23V entry already exists."

        grep -n -F 'Archer AX23' "$SOURCE" || true

        continue
    fi

    # ------------------------------------------------------------
    # Make sure original entry exists exactly once
    # ------------------------------------------------------------
    COUNT="$(grep -F -c "$AX23_ENTRY" "$SOURCE" || true)"

    if [ "$COUNT" -ne 1 ]; then
        echo
        echo "ERROR: unexpected AX23 entry count"
        echo "Expected: 1"
        echo "Found:    $COUNT"

        echo
        echo "Existing AX23 entries:"
        grep -n -F 'Archer AX23' "$SOURCE" || true

        exit 1
    fi

    # ------------------------------------------------------------
    # Insert AX23V entry after the original AX23 entry.
    #
    # awk is used here instead of sed to avoid nested escaping
    # problems between shell / sed / C string syntax.
    # ------------------------------------------------------------
    TMP="$(mktemp)"

    awk \
        -v old="$AX23_ENTRY" \
        -v new="$AX23V_ENTRY" '
        {
            print

            if (index($0, old) != 0) {
                print "\t\t\"" new "\\n\""
            }
        }
    ' "$SOURCE" > "$TMP"

    mv "$TMP" "$SOURCE"

    # ------------------------------------------------------------
    # Verify immediately
    # ------------------------------------------------------------
    if ! grep -qF "$AX23V_ENTRY" "$SOURCE"; then
        echo
        echo "ERROR: AX23V entry insertion failed"
        exit 1
    fi

    echo
    echo "OK: AX23V entry inserted."

    echo
    echo "AX23 entries after patch:"
    grep -n -F 'Archer AX23' "$SOURCE" || true

done

echo
echo "======================================"
echo "AX23V patch completed successfully"
echo "======================================"
