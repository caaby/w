name: Build OpenWrt AX23V

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      # ============================================================
      # 1. Checkout
      # ============================================================
      - name: Checkout
        uses: actions/checkout@v5

      # ============================================================
      # 2. Install dependencies
      # ============================================================
      - name: Install dependencies
        run: |
          set -eu

          sudo apt-get update

          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            build-essential \
            clang \
            flex \
            bison \
            g++ \
            gawk \
            gcc-multilib \
            g++-multilib \
            gettext \
            git \
            libncurses5-dev \
            libssl-dev \
            python3-setuptools \
            rsync \
            swig \
            unzip \
            zlib1g-dev \
            file \
            wget \
            subversion \
            patch \
            python3-pyelftools \
            libelf-dev

      # ============================================================
      # 3. Clone OpenWrt
      # ============================================================
      - name: Clone OpenWrt
        run: |
          set -eu

          git clone \
            --branch v25.12.5 \
            --depth 1 \
            https://github.com/openwrt/openwrt.git

          cd openwrt

          echo "======================================"
          echo "OpenWrt version"
          echo "======================================"

          git describe --tags --always

      # ============================================================
      # 4. Update feeds
      # ============================================================
      - name: Update feeds
        working-directory: openwrt
        run: |
          set -eu

          ./scripts/feeds update -a
          ./scripts/feeds install -a

      # ============================================================
      # 5. Configure
      # ============================================================
      - name: Configure
        working-directory: openwrt
        run: |
          set -eu

          cat > .config <<'EOF'
          #
          # Target
          #
          CONFIG_TARGET_ramips=y
          CONFIG_TARGET_ramips_mt7621=y
          CONFIG_TARGET_ramips_mt7621_DEVICE_tplink_archer-ax23-v1=y

          #
          # LuCI
          #
          CONFIG_PACKAGE_luci=y
          CONFIG_PACKAGE_luci-light=y

          #
          # Chinese
          #
          CONFIG_LUCI_LANG_zh-cn=y
          CONFIG_PACKAGE_luci-i18n-base-zh-cn=y

          #
          # usteer
          #
          CONFIG_PACKAGE_usteer=y
          CONFIG_PACKAGE_luci-app-usteer=y
          CONFIG_PACKAGE_luci-i18n-usteer-zh-cn=y

          #
          # PPPoE
          #
          CONFIG_PACKAGE_ppp=y
          CONFIG_PACKAGE_ppp-mod-pppoe=y

          #
          # Basic network
          #
          CONFIG_PACKAGE_dnsmasq=y
          CONFIG_PACKAGE_firewall4=y
          CONFIG_PACKAGE_netifd=y
          CONFIG_PACKAGE_odhcp6c=y
          CONFIG_PACKAGE_odhcpd-ipv6only=y

          #
          # SSH
          #
          CONFIG_PACKAGE_dropbear=y

          #
          # Wi-Fi
          #
          CONFIG_PACKAGE_wpad-basic-mbedtls=y
          EOF

          echo "======================================"
          echo "Running make defconfig"
          echo "======================================"

          make defconfig

          echo
          echo "======================================"
          echo "Target"
          echo "======================================"

          grep -E '^CONFIG_TARGET_' .config | grep -E 'ramips|mt7621|ax23'

          echo
          echo "======================================"
          echo "Packages"
          echo "======================================"

          grep -E '^CONFIG_PACKAGE_(luci|usteer|ppp|wpad)' .config || true

      # ============================================================
      # 6. Prepare firmware-utils
      #
      # This creates the firmware-utils source tree.
      # ============================================================
      - name: Prepare firmware-utils
        working-directory: openwrt
        run: |
          set -eu

          echo "======================================"
          echo "Preparing firmware-utils"
          echo "======================================"

          make tools/firmware-utils/compile V=s

      # ============================================================
      # 7. Patch AX23V
      # ============================================================
      - name: Patch AX23V
        working-directory: openwrt
        run: |
          set -eu

          chmod +x ../scripts/patch-ax23v.sh

          echo "======================================"
          echo "Patching AX23V safeloader"
          echo "======================================"

          ../scripts/patch-ax23v.sh

      # ============================================================
      # 8. Verify source patch
      # ============================================================
      - name: Verify AX23V source
        working-directory: openwrt
        run: |
          set -eu

          AX23V_ENTRY='{product_name:Archer AX23V,product_ver:1.0,special_id:4A500000}'

          echo "======================================"
          echo "Checking patched safeloader source"
          echo "======================================"

          SOURCES="$(find build_dir/host \
            -type f \
            -path '*/src/tplink-safeloader.c' \
            -print)"

          if [ -z "$SOURCES" ]; then
            echo "ERROR: tplink-safeloader.c not found"
            exit 1
          fi

          FOUND=0

          while IFS= read -r SOURCE; do
            [ -z "$SOURCE" ] && continue

            echo
            echo "Source:"
            echo "$SOURCE"

            if grep -qF "$AX23V_ENTRY" "$SOURCE"; then
              echo "OK: AX23V entry found"
              FOUND=$((FOUND + 1))
            else
              echo "ERROR: AX23V entry NOT found"
              exit 1
            fi

            echo
            echo "AX23 entries:"
            grep -n -F 'Archer AX23' "$SOURCE" || true

          done <<EOF
          $SOURCES
          EOF

          if [ "$FOUND" -eq 0 ]; then
            echo "ERROR: no patched safeloader source found"
            exit 1
          fi

          echo
          echo "======================================"
          echo "Source patch verified"
          echo "======================================"

      # ============================================================
      # 9. Force firmware-utils rebuild
      #
      # The first firmware-utils build happened before the patch.
      # Remove the complete firmware-utils host build directory so
      # the patched source is compiled again.
      # ============================================================
      - name: Clean firmware-utils
        working-directory: openwrt
        run: |
          set -eu

          echo "======================================"
          echo "Cleaning firmware-utils build"
          echo "======================================"

          DIRS="$(find build_dir/host \
            -maxdepth 1 \
            -type d \
            -name 'firmware-utils-*' \
            -print)"

          if [ -z "$DIRS" ]; then
            echo "ERROR: firmware-utils build directory not found"
            exit 1
          fi

          while IFS= read -r DIR; do
            [ -z "$DIR" ] && continue

            echo "Removing:"
            echo "$DIR"

            rm -rf "$DIR"
          done <<EOF
          $DIRS
          EOF

      # ============================================================
      # 10. Rebuild firmware-utils
      # ============================================================
      - name: Rebuild firmware-utils
        working-directory: openwrt
        run: |
          set -eu

          echo "======================================"
          echo "Rebuilding firmware-utils"
          echo "======================================"

          make tools/firmware-utils/compile V=s

      # ============================================================
      # 11. Build firmware
      # ============================================================
      - name: Build firmware
        working-directory: openwrt
        run: |
          set -eu

          echo "======================================"
          echo "Building OpenWrt firmware"
          echo "======================================"

          make -j"$(nproc)" V=s

      # ============================================================
      # 12. Verify final firmware
      # ============================================================
      - name: Verify firmware
        working-directory: openwrt
        run: |
          set -eu

          FACTORY="bin/targets/ramips/mt7621/openwrt-ramips-mt7621-tplink_archer-ax23-v1-squashfs-factory.bin"

          AX23V_ENTRY='{product_name:Archer AX23V,product_ver:1.0,special_id:4A500000}'

          echo "======================================"
          echo "Checking firmware"
          echo "======================================"

          if [ ! -f "$FACTORY" ]; then
            echo "ERROR: factory firmware not found:"
            echo "$FACTORY"
            exit 1
          fi

          echo
          echo "Firmware files:"
          ls -lh bin/targets/ramips/mt7621/*ax23*

          echo
          echo "File type:"
          file bin/targets/ramips/mt7621/*ax23*

          echo
          echo "======================================"
          echo "AX23 / AX23V strings in factory"
          echo "======================================"

          strings "$FACTORY" | grep -i 'Archer AX23' || true

          echo
          echo "======================================"
          echo "Checking AX23V entry"
          echo "======================================"

          if strings "$FACTORY" | grep -qF "$AX23V_ENTRY"; then
            echo
            echo "======================================"
            echo "SUCCESS"
            echo "AX23V entry found in factory firmware."
            echo "======================================"
          else
            echo
            echo "======================================"
            echo "ERROR"
            echo "AX23V entry NOT found in factory firmware."
            echo "======================================"
            exit 1
          fi

      # ============================================================
      # 13. Package firmware
      # ============================================================
      - name: Package firmware
        working-directory: openwrt
        run: |
          set -eu

          mkdir -p ../release

          cp bin/targets/ramips/mt7621/*ax23* ../release/
          cp bin/targets/ramips/mt7621/sha256sums ../release/

          echo "======================================"
          echo "Release files"
          echo "======================================"

          ls -lh ../release

      # ============================================================
      # 14. Upload firmware
      # ============================================================
      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenWrt-25.12.5-AX23V
          path: release/
          if-no-files-found: error
          retention-days: 30
