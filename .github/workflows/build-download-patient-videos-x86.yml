name: Build DownloadPatientVideos x86

on:
  workflow_dispatch:
  push:
    paths:
      - 'download_patient_videos_gui.py'
      - '.github/workflows/build-download-patient-videos-x86.yml'

jobs:
  build-windows-x86:
    name: Build Windows 32-bit exe
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 32-bit
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: 'x86'

      - name: Show Python architecture
        run: python -c "import platform; print(platform.architecture()[0])"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade nuitka ordered-set zstandard requests openpyxl

      - name: Check syntax
        working-directory: ./
        run: python -m py_compile download_patient_videos_gui.py

      - name: Build exe with Nuitka
        working-directory: ./
        shell: cmd
        run: |
          python -m nuitka ^
            --standalone ^
            --onefile ^
            --windows-console-mode=disable ^
            --enable-plugin=tk-inter ^
            --include-package=openpyxl ^
            --include-package=requests ^
            --assume-yes-for-downloads ^
            --output-dir=dist_nuitka ^
            --output-filename=DownloadPatientVideos_x86.exe ^
            download_patient_videos_gui.py

      - name: Upload exe artifact
        uses: actions/upload-artifact@v4
        with:
          name: DownloadPatientVideos-x86
          path: ./dist_nuitka/DownloadPatientVideos_x86.exe
          if-no-files-found: error
