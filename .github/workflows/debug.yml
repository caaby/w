name: Build OpenWrt debug

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      # ============================================================
      # 1. Checkout
      # ============================================================
      - name: Checkout
        uses: actions/checkout@v5

      # ============================================================
      # 2. Install dependencies
      # ============================================================
      - name: Install dependencies
        run: |
          set -eu

          sudo apt-get update

          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            build-essential \
            clang \
            flex \
            bison \
            g++ \
            gawk \
            gcc-multilib \
            g++-multilib \
            gettext \
            git \
            libncurses5-dev \
            libssl-dev \
            python3-setuptools \
            rsync \
            swig \
            unzip \
            zlib1g-dev \
            file \
            wget \
            subversion \
            patch \
            python3-pyelftools \
            libelf-dev

      # ============================================================
      # 3. Clone OpenWrt
      # ============================================================
      - name: Clone OpenWrt
        run: |
          set -eu

          git clone \
            --branch v25.12.5 \
            --depth 1 \
            https://github.com/openwrt/openwrt.git

          cd openwrt

          echo "======================================"
          echo "OpenWrt version"
          echo "======================================"

          git describe --tags --always

      # ============================================================
      # 4. Use custom firmware-utils
      #
      # firmware-utils is built from our own fork/commit.
      # ============================================================
      - name: Use custom firmware-utils
        working-directory: openwrt
        run: |
          set -eu

          FIRMWARE_UTILS_URL="https://github.com/caaby/firmware-utils.git"
          FIRMWARE_UTILS_COMMIT="8925f0cfa0c2bcdd141e38803f0292882c446e4c"

          echo "======================================"
          echo "Using custom firmware-utils"
          echo "======================================"

          echo "URL:"
          echo "$FIRMWARE_UTILS_URL"

          echo "Commit:"
          echo "$FIRMWARE_UTILS_COMMIT"

          sed -i \
            "s#^PKG_SOURCE_URL=.*#PKG_SOURCE_URL:=$FIRMWARE_UTILS_URL#" \
            tools/firmware-utils/Makefile

          sed -i \
            "s#^PKG_SOURCE_VERSION:=.*#PKG_SOURCE_VERSION:=$FIRMWARE_UTILS_COMMIT#" \
            tools/firmware-utils/Makefile

          # The upstream mirror hash belongs to the upstream
          # firmware-utils source and is no longer valid.
          sed -i \
            '/^PKG_MIRROR_HASH:=/d' \
            tools/firmware-utils/Makefile

          echo
          echo "======================================"
          echo "firmware-utils configuration"
          echo "======================================"

          grep -E \
            '^PKG_SOURCE_URL|^PKG_SOURCE_VERSION|^PKG_MIRROR_HASH' \
            tools/firmware-utils/Makefile || true

      # ============================================================
      # 5. Update feeds
      # ============================================================
      - name: Update feeds
        working-directory: openwrt
        run: |
          set -eu

          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Show system
        run: |
          echo "===== SYSTEM ====="
          cat /etc/os-release
          uname -a
          whoami
          df -h

      - name: Setup SSH debug session
        uses: WarpBuilds/action-debugger@v1.3
        with:
          detached: true
