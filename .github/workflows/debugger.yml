name: OpenWrt Debug Environment

on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest

    container:
      image: ubuntu:24.04

    steps:
      - name: Install dependencies
        run: |
          apt-get update

          DEBIAN_FRONTEND=noninteractive apt-get install -y \
            build-essential \
            clang \
            flex \
            bison \
            g++ \
            gawk \
            gcc-multilib \
            g++-multilib \
            gettext \
            git \
            libncurses5-dev \
            libssl-dev \
            python3-setuptools \
            rsync \
            swig \
            unzip \
            zlib1g-dev \
            file \
            wget \
            subversion \
            patch \
            python3-pyelftools \
            libelf-dev \
            ca-certificates \
            openssh-client

      - name: Start tmate debug
        uses: mxschmitt/action-tmate@v3
        with:
          connect-timeout-seconds: 3600
